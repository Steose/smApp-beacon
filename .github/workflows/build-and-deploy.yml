name: Build and Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"

permissions:
  contents: read
  packages: write

env:
  RESOURCE_GROUP: rg-clo25-steven
  CLUSTER: aks-clo25-steven

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check Out the Code
        uses: actions/checkout@v7

      - name: Sign In to the Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set Up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push the Image
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')
          image="ghcr.io/$owner/beacon:${GITHUB_SHA::7}"
          docker buildx build \
            --file src/Beacon.Api/Dockerfile \
            --platform linux/amd64,linux/arm64 \
            --tag "$image" \
            --push \
            .
          echo "Pushed $image"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-24.04
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check Out the Code
        uses: actions/checkout@v7

      - name: Sign In to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Connect to the Cluster
        run: |
          az aks get-credentials \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CLUSTER"

      - name: Set Up Helm 4
        uses: azure/setup-helm@v5
        with:
          version: v4.3.0

      - name: Deploy with Helm
        run: |
          helm upgrade --install beacon ./charts/beacon \
            --set imageTag="${GITHUB_SHA::7}" \
            --wait \
            --timeout 5m